<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="dark light">
<script src="/site-preferences.js"></script>
<title>404. الصفحة غير موجودة | NEW MEDIA</title>
<link rel="icon" type="image/png" href="/newmedia-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #050505;
    color: #fff;
    font-family: 'Tajawal', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    overflow: hidden;
  }
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
  }
  .orb-1 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(102,0,204,0.3) 0%, transparent 70%);
    top: -150px; right: -150px;
  }
  .orb-2 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(255,102,0,0.2) 0%, transparent 70%);
    bottom: -100px; left: -100px;
  }
  .num {
    font-family: 'Alexandria', sans-serif;
    font-weight: 900;
    font-size: clamp(100px, 20vw, 180px);
    line-height: 1;
    background: linear-gradient(135deg, #6600cc, #cc3366, #ff6600);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    position: relative;
    z-index: 1;
  }
  .title {
    font-family: 'Alexandria', sans-serif;
    font-weight: 900;
    font-size: clamp(22px, 4vw, 36px);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 1.5rem 0 1rem;
    position: relative;
    z-index: 1;
  }
  .sub {
    font-size: 16px;
    color: rgba(255,255,255,0.5);
    max-width: 400px;
    line-height: 1.8;
    margin-bottom: 2.5rem;
    position: relative;
    z-index: 1;
  }
  .btn {
    font-family: 'Alexandria', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fff;
    text-decoration: none;
    background: linear-gradient(135deg, #6600cc, #ff6600);
    padding: 14px 32px;
    border-radius: 12px;
    transition: opacity 0.3s, transform 0.2s;
    position: relative;
    z-index: 1;
  }
  .btn:hover { opacity: 0.85; transform: translateY(-2px); }
  .theme-btn-404 { position:fixed; top:1.25rem; left:1.25rem; font-size:15px; color:rgba(255,255,255,.65); background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.14); width:34px; height:34px; border-radius:8px; cursor:pointer; transition:all .3s; display:flex; align-items:center; justify-content:center; z-index:100; }
  .theme-btn-404:hover { background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.28); }
  .lang-btn-404 { position:fixed; top:1.25rem; right:1.25rem; height:34px; padding:0 12px; color:rgba(255,255,255,.65); background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.14); border-radius:8px; cursor:pointer; font-family:'Alexandria',sans-serif; font-size:12px; font-weight:700; z-index:100; }
  .footer-copy-404 { position:fixed; right:1.5rem; bottom:1.25rem; left:1.5rem; color:rgba(255,255,255,.35); font-size:12px; z-index:1; }
  html.light body { background:#f5f5f7; color:#0d0d0d; }
  html.light .sub { color:rgba(0,0,0,.45); }
  html.light .orb-1 { background:radial-gradient(circle,rgba(102,0,204,.18),transparent 70%); }
  html.light .orb-2 { background:radial-gradient(circle,rgba(255,102,0,.14),transparent 70%); }
  html.light .theme-btn-404 { color:rgba(0,0,0,.6); background:rgba(0,0,0,.05); border-color:rgba(0,0,0,.13); }
  html.light .theme-btn-404:hover { background:rgba(0,0,0,.1); color:#0d0d0d; border-color:rgba(0,0,0,.25); }
  html.light .lang-btn-404 { color:rgba(0,0,0,.6); background:rgba(0,0,0,.05); border-color:rgba(0,0,0,.13); }
  html.light .footer-copy-404 { color:rgba(0,0,0,.4); }
</style>
<link rel="stylesheet" href="/site-fixes.css?v=36">
</head>
<body>
  <button class="theme-btn-404" id="themeBtn" aria-label="Toggle theme" title="Dark / Light">☽</button>
  <button class="lang-btn-404" id="langBtn" aria-label="Switch language">EN</button>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="num">404</div>
  <h1 class="title" data-i18n="title">الصفحة غير موجودة</h1>
  <p class="sub" data-i18n="sub">يبدو أن هذه الصفحة لا وجود لها. ربما تم نقلها أو حذفها.</p>
  <a href="/" class="btn" data-i18n="back">العودة للرئيسية</a>
  <p class="footer-copy-404" data-i18n="footer_copy">© جميع الحقوق محفوظة لدى New Media.</p>
<script>
  const translations={
    ar:{
      lang:'ar', dir:'rtl', btn:'EN',
      title:'الصفحة غير موجودة',
      sub:'يبدو أن هذه الصفحة لا وجود لها. ربما تم نقلها أو حذفها.',
      back:'العودة للرئيسية',
      footer_copy:'© جميع الحقوق محفوظة لدى New Media.'
    },
    en:{
      lang:'en', dir:'ltr', btn:'ع',
      title:'Page Not Found',
      sub:'This page does not seem to exist. It may have been moved or deleted.',
      back:'Back to Home',
      footer_copy:'© All rights reserved by New Media.'
    }
  };
  let currentLang=window.NMPreferences.getLanguage();
  function applyLang(language){
    currentLang=window.NMPreferences.setLanguage(language);
    const text=translations[currentLang];
    document.getElementById('langBtn').textContent=text.btn;
    document.querySelectorAll('[data-i18n]').forEach((element)=>{element.textContent=text[element.dataset.i18n];});
    document.title=currentLang==='ar'?'404. الصفحة غير موجودة | NEW MEDIA':'404. Page Not Found | NEW MEDIA';
  }
  document.getElementById('langBtn').addEventListener('click',()=>applyLang(currentLang==='ar'?'en':'ar'));
  applyLang(currentLang);
  const themeBtn=document.getElementById('themeBtn');
  function applyTheme(t){const theme=window.NMPreferences.setTheme(t);themeBtn.textContent=theme==='light'?'☀':'☽';}
  applyTheme(window.NMPreferences.getTheme());
  themeBtn.addEventListener('click',()=>applyTheme(document.documentElement.classList.contains('light')?'dark':'light'));
</script>
</body>
</html>
